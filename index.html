<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手話ミラー / Shuwa Mirror</title>
  <meta name="description" content="お題の手話をお手本動画で見て、自分の手をカメラの鏡で確認しながら1つずつ覚えられる手話学習アプリ。レッスンとテストで身につきます。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ====== ホーム ====== -->
  <section class="screen home active" id="homeScreen">
    <div class="home-inner">
      <div class="hero-badge">🙌 手話を おぼえよう</div>
      <h1 class="home-title">手話ミラー</h1>
      <p class="home-sub">お手本を見て、自分の手を鏡でかくにん。1つずつ おぼえよう！</p>

      <div class="progress-card">
        <div class="progress-card-row">
          <span>おぼえた 手話</span>
          <span class="progress-count"><strong id="learnedCount">0</strong> / <span id="totalCount">0</span></span>
        </div>
        <div class="bar"><div class="bar-fill" id="homeBar"></div></div>
      </div>

      <div class="home-actions">
        <button class="big-btn lesson" id="startLessonBtn">
          <span class="big-btn-emoji">✏️</span>
          <span class="big-btn-label">レッスン</span>
          <span class="big-btn-note">お手本を見て まねる</span>
        </button>
        <button class="big-btn test" id="startTestBtn">
          <span class="big-btn-emoji">🏅</span>
          <span class="big-btn-label">テスト</span>
          <span class="big-btn-note">力だめし</span>
        </button>
      </div>

      <p class="home-foot">カメラの映像はあなたの端末の中だけで使われ、どこにも送信されません。<br>お手本は YouTube の参考動画です（手話は地域や人で表現が異なる場合があります）。</p>
    </div>
  </section>

  <!-- ====== 学習（レッスン／テスト共通） ====== -->
  <section class="screen study" id="studyScreen">
    <header class="study-bar">
      <button class="icon-btn" id="exitBtn" aria-label="ホームへもどる">✕</button>
      <div class="study-bar-center">
        <span class="mode-chip" id="modeChip">レッスン</span>
        <span class="progress-text" id="progressText">1 / 13</span>
      </div>
      <span class="score-chip" id="scoreChip" hidden>⭐ 0</span>
    </header>

    <div class="bar study-progress"><div class="bar-fill" id="studyBar"></div></div>

    <div class="study-body">
      <div class="left-col">
        <!-- お題 -->
        <div class="prompt-card">
          <span class="cat-chip" id="catChip">あいさつ</span>
          <p class="prompt-lead" id="promptLead">この手話を やってみよう</p>
          <div class="word" id="word">おはよう</div>
          <div class="reading" id="reading">ohayō</div>
        </div>

        <!-- お手本 -->
        <div class="sample" id="sample">
          <div class="sample-head">
            <span class="sample-tag">▶ お手本（参考動画）</span>
            <a class="sample-search" id="sampleSearch" href="#" target="_blank" rel="noopener">ほかの動画を探す ↗</a>
          </div>
          <div class="sample-video" id="sampleVideo"><!-- iframe / リンクが入る --></div>
          <div class="steps" id="steps">
            <span class="steps-tag">うごきのヒント</span>
            <p id="stepsText"></p>
          </div>
        </div>
      </div>

      <!-- ミラー -->
      <div class="mirror">
        <p class="mirror-label">🪞 あなたの手（鏡）</p>
        <div class="video-wrap mirrored" id="videoWrap">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="stage-message" id="stageMessage">
            <p>📷 カメラを準備しています…</p>
          </div>
        </div>
        <div class="finger-readout" id="fingerReadout">手をカメラにうつしてね</div>
      </div>
    </div>

    <!-- 操作（モードで切り替え） -->
    <footer class="study-controls" id="studyControls"></footer>
  </section>

  <!-- ====== 結果 ====== -->
  <section class="screen result" id="resultScreen">
    <div class="result-inner">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 class="result-title" id="resultTitle">よくできました！</h2>
      <p class="result-score" id="resultScore"></p>
      <div class="result-actions">
        <button class="big-btn test" id="resultRetryBtn">
          <span class="big-btn-emoji">🔁</span>
          <span class="big-btn-label">もういちど</span>
        </button>
        <button class="big-btn home" id="resultHomeBtn">
          <span class="big-btn-emoji">🏠</span>
          <span class="big-btn-label">ホームへ</span>
        </button>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
